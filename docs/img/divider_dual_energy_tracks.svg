<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100">
  <path d="M0 40 H1000" stroke="#E8DEC8" stroke-width="4"/>
  <path d="M0 60 H1000" stroke="#E8DEC8" stroke-width="4"/>

