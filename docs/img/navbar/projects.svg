<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100">
  <defs>
    <linearGradient id="g-proj" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#DAC0A3"/>
      <stop offset="100%" stop-color="#C88A58"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>.t{font:700 13px 'Segoe UI', Arial, sans-serif; fill:#FDFBF7; letter-spacing:2px;}</style>
    <linearGradient id="borderGradSmall">
      <stop offset="0%" stop-color="#DAC0A3"/>
      <stop offset="50%" stop-color="#C88A58"/>
      <stop offset="100%" stop-color="#8D7B68"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        values="-120 0;120 0;-120 0"
        dur="4s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="10" y="20" width="280" height="60" rx="12" fill="#251E1A"/>

  <rect x="10" y="20" width="280" height="60" rx="12"
        fill="none"
        stroke="url(#borderGradSmall)"
        stroke-width="1.8"
        stroke-dasharray="420"
        stroke-dashoffset="420"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             values="420;0"
             dur="3s"
             repeatCount="indefinite"/>
  </rect>

  <circle cx="60" cy="50" r="8" fill="url(#g-proj)" filter="url(#glow)">
    <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="160" y="55" text-anchor="middle" class="t">PROJECTS</text>
</svg>
