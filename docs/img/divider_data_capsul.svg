<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="110">
  <!-- symmetric split -->
  <line x1="0" y1="55" x2="520" y2="55" stroke="#E8DEC8" stroke-width="2"/>
  <line x1="680" y1="55" x2="1200" y2="55" stroke="#E8DEC8" stroke-width="2"/>

  <!-- warm cream centered panel -->
  <rect x="520" y="35" width="160" height="40" rx="20" fill="#FDFBF7" stroke="#DAC0A3" stroke-width="1.5"/>

  <!-- warm palette dots -->
  <circle cx="560" cy="55" r="5" fill="#C88A58"/>
  <circle cx="600" cy="55" r="5" fill="#A27B5C"/>
  <circle cx="640" cy="55" r="5" fill="#8D7B68">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
