<svg width="1600" height="320" viewBox="0 0 1600 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="320">
      <stop offset="0%" stop-color="#191411"/>
      <stop offset="50%" stop-color="#261E1A"/>
      <stop offset="100%" stop-color="#140F0D"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" stroke="#DAC0A3" stroke-opacity="0.05">
        <animateTransform attributeName="transform"
          type="translate"
          values="0 0;40 40;0 0"
          dur="18s"
          repeatCount="indefinite"/>
      </path>
    </pattern>

    <!-- Flow gradient -->
    <linearGradient id="flowGrad">
      <stop offset="0%" stop-color="#DAC0A3" stop-opacity="0"/>
      <stop offset="30%" stop-color="#DAC0A3" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#C88A58" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8D7B68" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        values="-240 0; 240 0; -240 0"
        dur="6s"
        repeatCount="indefinite"/>
    </linearGradient>

    <style>
      .title { font: 800 42px 'Segoe UI', Arial, sans-serif; fill: #FDFBF7; letter-spacing: 3px; }
      .sub { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #D4A373; letter-spacing: 2px; }
      .meta { font: 700 12px monospace; fill: #DAC0A3; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1600" height="320" fill="url(#bgGrad)"/>
  <rect width="1600" height="320" fill="url(#grid)"/>

  <!-- Energy line -->
  <line x1="200" y1="210" x2="1400" y2="210" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>

  <text x="800" y="80" text-anchor="middle" class="meta">AI RESEARCH &amp; ARCHITECTURAL DOMAINS</text>
  <text x="800" y="145" text-anchor="middle" class="title">COGNITIVE SYSTEMS &amp; SCIENTIFIC ML</text>
  <text x="800" y="185" text-anchor="middle" class="sub">REAL-TIME VOICE TELEPHONY • AUTONOMOUS AGENTS • SINDY ODE DISCOVERY • CLINICAL RAG</text>

</svg>
