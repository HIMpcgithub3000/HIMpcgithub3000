<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#261E1A"/>
      <stop offset="70%" stop-color="#191411"/>
      <stop offset="100%" stop-color="#140F0D"/>
    </radialGradient>

    <!-- Core gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="25%" stop-color="#DAC0A3"/>
      <stop offset="65%" stop-color="#C88A58"/>
      <stop offset="100%" stop-color="#191411"/>
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DAC0A3"/>
      <stop offset="50%" stop-color="#C88A58"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font: 800 38px 'Segoe UI', Arial, sans-serif;
        fill: url(#titleGrad);
        letter-spacing: 3px;
      }
      .subtitle {
        font: 600 13px 'Segoe UI', Arial, sans-serif;
        fill: #D4A373;
        letter-spacing: 2px;
      }
      .system {
        font: 700 12px monospace;
        fill: #DAC0A3;
        letter-spacing: 3px;
      }
      .line {
        stroke: #4A3E3D;
        stroke-width: 2;
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- Core energy center -->
  <g transform="translate(600,150)">
    <circle r="75" fill="url(#coreGrad)" filter="url(#glow)">
      <animate attributeName="r" values="70;85;70" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="25" fill="#FDFBF7">
      <animate attributeName="r" values="22;28;22" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Side lines -->
  <line x1="80" y1="150" x2="460" y2="150" class="line"/>
  <line x1="740" y1="150" x2="1120" y2="150" class="line"/>

  <!-- Small system nodes -->
  <g filter="url(#glow)">
    <circle cx="460" cy="150" r="6" fill="#DAC0A3"/>
    <circle cx="740" cy="150" r="6" fill="#C88A58"/>
  </g>

  <!-- Animated signals -->
  <circle r="4" fill="#FDFBF7">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M460,150 C520,140 560,140 600,150"/>
  </circle>

  <circle r="4" fill="#DAC0A3">
    <animateMotion dur="3.5s" repeatCount="indefinite"
      path="M600,150 C640,160 680,160 740,150"/>
  </circle>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" class="title">
    PROJECT SYSTEMS &amp; COMPENDIUM
  </text>

  <!-- Subtitle -->
  <text x="600" y="265" text-anchor="middle" class="subtitle">
    HIGH-THROUGHPUT ROUTERS • VOICE TELEPHONY • AUTONOMOUS AGENTS • SCIENTIFIC ML
  </text>

  <!-- System label -->
  <text x="600" y="40" text-anchor="middle" class="system">
    SYSTEM ACCESS: PROJECT MODULES
  </text>

</svg>
