<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100">
  <defs>
    <linearGradient id="g-web" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#2E30FF"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <style>.t{font:600 12px 'Segoe UI'; fill:#e2e8f0; letter-spacing:2px;}</style>
  </defs>

  <!-- base -->
  <!-- Neon animated border -->
    <linearGradient id="borderGradSmall">
      <stop offset="0%" stop-color="#2E30FF"/>
      <stop offset="50%" stop-color="#5E60FF"/>
      <stop offset="100%" stop-color="#9641B7"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        values="-120 0;120 0;-120 0"
        dur="3s"
        repeatCount="indefinite"/>
    </linearGradient>
      <!-- base fill -->
    <rect x="10" y="20" width="280" height="60" rx="12"
          fill="#020617"/>

    <!-- animated neon border -->
    <rect x="10" y="20" width="280" height="60" rx="12"
          fill="none"
          stroke="url(#borderGradSmall)"
          stroke-width="1.8"
          stroke-dasharray="420"
          stroke-dashoffset="420"
          filter="url(#glow)">
      <animate attributeName="stroke-dashoffset"
               values="420;0"
               dur="2.8s"
               repeatCount="indefinite"/>
    </rect>

  <!-- rotating ring -->
  <g transform="translate(70 50)">
    <circle r="8" fill="url(#g-web)"/>
    <circle r="16" fill="none" stroke="#5E60FF" stroke-opacity="0.3"
      stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="180" y="55" text-anchor="middle" class="t">WEBSITE</text>
</svg>