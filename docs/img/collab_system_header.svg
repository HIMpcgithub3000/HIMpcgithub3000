<svg width="1600" height="320" viewBox="0 0 1600 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="320">
      <stop offset="0%" stop-color="#191411"/>
      <stop offset="50%" stop-color="#261E1A"/>
      <stop offset="100%" stop-color="#140F0D"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="160" y1="0" x2="1440" y2="0">
      <stop offset="0%" stop-color="#DAC0A3" stop-opacity="0"/>
      <stop offset="20%" stop-color="#DAC0A3"/>
      <stop offset="50%" stop-color="#C88A58"/>
      <stop offset="80%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#DAC0A3" stop-opacity="0"/>

      <animateTransform attributeName="gradientTransform"
                        type="translate"
                        values="-200 0;200 0;-200 0"
                        dur="6s"
                        repeatCount="indefinite"/>
    </linearGradient>

    <style>
      .kicker { font: 700 13px monospace; letter-spacing: 4px; fill: #DAC0A3; }
      .title { font: 800 44px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #FDFBF7; }
      .desc { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #D4A373; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="320" fill="url(#bgGrad)"/>
  <line x1="200" y1="210" x2="1400" y2="210" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

  <text x="800" y="85" text-anchor="middle" class="kicker">ENGINEERING COLLABORATION PROTOCOL</text>
  <text x="800" y="145" text-anchor="middle" class="title">HIGH-IMPACT SYSTEMS &amp; OPEN SOURCE</text>
  <text x="800" y="185" text-anchor="middle" class="desc">DISTRIBUTED BACKEND • VOICE AI • AGENTIC RUNTIMES • SCIENTIFIC ML</text>
</svg>
