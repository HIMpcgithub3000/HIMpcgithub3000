<svg viewBox="0 0 500 650" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- background -->
    <radialGradient id="bg">
      <stop offset="0%" stop-color="#261E1A"/>
      <stop offset="100%" stop-color="#140F0D"/>
    </radialGradient>

    <!-- core -->
    <radialGradient id="core">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="30%" stop-color="#DAC0A3"/>
      <stop offset="65%" stop-color="#C88A58"/>
      <stop offset="100%" stop-color="#140F0D"/>
    </radialGradient>

    <!-- links -->
    <linearGradient id="link">
      <stop offset="0%" stop-color="#DAC0A3" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C88A58" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8D7B68" stop-opacity="0.1"/>
    </linearGradient>

    <!-- glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- warp -->
    <filter id="warp">
      <feTurbulence baseFrequency="0.01" numOctaves="2" seed="3">
        <animate attributeName="baseFrequency"
          values="0.01;0.015;0.01"
          dur="10s"
          repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="8"/>
    </filter>

    <style>
      .label { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #D4A373; letter-spacing: 1px; }
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #FDFBF7; letter-spacing: 2px;}
    </style>

  </defs>

  <!-- background -->
  <rect width="500" height="650" fill="url(#bg)"/>

  <!-- ambient field -->
  <g filter="url(#bigGlow)" opacity="0.5">
    <circle cx="250" cy="320" r="200" fill="#DAC0A3" opacity="0.06">
      <animate attributeName="r" values="180;220;180" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="320" r="150" fill="#C88A58" opacity="0.07">
      <animate attributeName="r" values="130;170;130" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- main system -->
  <g transform="translate(250 320)" filter="url(#warp)">

    <!-- rotating field -->
    <ellipse rx="200" ry="120" fill="none" stroke="#DAC0A3" stroke-opacity="0.25" stroke-dasharray="6 18">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse rx="120" ry="210" fill="none" stroke="#C88A58" stroke-opacity="0.25" stroke-dasharray="4 20">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <!-- neural-style mesh -->
    <g stroke="url(#link)" stroke-width="2.2" stroke-linecap="round">

      <line x1="-40" y1="-60" x2="0" y2="0"/>
      <line x1="0" y1="0" x2="80" y2="-40"/>
      <line x1="0" y1="0" x2="100" y2="90"/>
      <line x1="0" y1="0" x2="-90" y2="110"/>
      <line x1="0" y1="0" x2="-120" y2="-70"/>

    </g>

    <!-- signal streams -->
    <circle r="3" fill="#FDFBF7">
      <animateMotion dur="2.4s" repeatCount="indefinite"
        path="M0,0 C0,-80 0,-140 0,-200"/>
    </circle>

    <circle r="3" fill="#DAC0A3">
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M0,0 C60,-20 100,-40 140,-70"/>
    </circle>

    <circle r="3" fill="#C88A58">
      <animateMotion dur="2.8s" repeatCount="indefinite"
        path="M0,0 C80,50 120,80 160,120"/>
    </circle>

    <!-- core -->
    <g filter="url(#glow)">
      <circle r="80" fill="url(#core)">
        <animate attributeName="r" values="70;95;70" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="30" fill="#FDFBF7"/>
    </g>

    <!-- nodes -->
    <g filter="url(#glow)">
      <circle cx="0" cy="-200" r="16" fill="#DAC0A3"/>
      <circle cx="140" cy="-70" r="14" fill="#C88A58"/>
      <circle cx="160" cy="120" r="14" fill="#D4A373"/>
      <circle cx="0" cy="210" r="16" fill="#DAC0A3"/>
      <circle cx="-140" cy="120" r="14" fill="#C88A58"/>
      <circle cx="-120" cy="-70" r="14" fill="#D4A373"/>
    </g>

  </g>

  <!-- background particles -->
  <g opacity="0.6" filter="url(#glow)">
    <circle cx="80" cy="200" r="2" fill="#FDFBF7">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="240" r="2.5" fill="#DAC0A3">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="580" r="2" fill="#C88A58">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- labels -->
  <text x="250" y="80" text-anchor="middle" class="label">VOICE AI</text>
  <text x="410" y="250" class="label">AGENTIC</text>
  <text x="420" y="500" class="label">RAG</text>
  <text x="250" y="620" text-anchor="middle" class="label">SCIML</text>
  <text x="40" y="500" class="label">FINTECH</text>
  <text x="40" y="250" class="label">VISION</text>

  <!-- title -->
  <text x="250" y="45" text-anchor="middle" class="title">
    AI DOMAINS
  </text>

</svg>
